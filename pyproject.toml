[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gphotos-freer"
version = "0.1.0"
description = "Move Google Photos items that use storage onto free storage, and upload new ones for free."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "gpmc>=0.9",
]

[project.scripts]
gphotos-freer = "gphotos_freer.cli:main"

[tool.setuptools]
packages = ["gphotos_freer"]

[tool.setuptools.package-data]
gphotos_freer = ["*.js"]
